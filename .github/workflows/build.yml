name: SonarQube
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu'
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore NuGet packages
        shell: powershell
        run: |
          nuget restore Backgammon.Client\packages.config -PackagesDirectory packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          nuget restore Backgammon.Server\packages.config -PackagesDirectory packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create server configuration placeholder
        shell: powershell
        run: |
          $serverConfigurationPath = "Backgammon.Server\DBSecrets.config"

          if (-not (Test-Path -LiteralPath $serverConfigurationPath)) {
            Set-Content -LiteralPath $serverConfigurationPath -Value '<connectionStrings />' -Encoding UTF8
          }
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          $scannerPath = Join-Path $env:RUNNER_TEMP "scanner\dotnet-sonarscanner.exe"

          & $scannerPath begin /k:"DanielPowerLIS_Backgammon" /o:"danielpowerlis" "/d:sonar.token=$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          msbuild Backgammon.Client\Backgammon.Client.csproj /t:Rebuild /p:Configuration=Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          msbuild Backgammon.Server\Backgammon.Server.csproj /t:Rebuild /p:Configuration=Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $scannerPath end "/d:sonar.token=$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }